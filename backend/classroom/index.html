        function escapeInlineJs(str) { return str ? String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '\\r') : ''; }

        function generateUniqueCode() {

            do { code = Math.floor(10000 + Math.random() * 90000).toString(); attempts++; } while (currentStudents.some(s => s.code === code) && attempts < 100);

        function compressImage(file, callback, max_size = 300, quality = 0.8) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } } 
                    else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality)); 
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // --- XỬ LÝ TÌM KIẾM LIÊN KẾT CHÉO ---
        window.handleLobbySearch = function(query) {
            const clearBtn = document.getElementById('clear-search-btn');
            const contentArea = document.getElementById('lobby-dynamic-content');
            if(!contentArea) return;

            const q = query.trim().toLowerCase();
            
            if (q === '') {
                if(clearBtn) clearBtn.classList.add('hidden');
                contentArea.innerHTML = window.generateLobbyClassesHtml();
                return;
            }

            if(clearBtn) clearBtn.classList.remove('hidden');

            let resultsHtml = '';
            let matchCount = 0;
            let matchingNames = new Set();
            
            // Bước 1: Quét trong Bảng tổng để đối chiếu Tên thông qua Số điện thoại
            if (appData.globalStudents) {
                appData.globalStudents.forEach(gs => {
                    if ((gs.name && gs.name.toLowerCase().includes(q)) || 
                        (gs.phone && gs.phone.toLowerCase().includes(q))) {
                        if (gs.name) matchingNames.add(gs.name.toLowerCase().trim());
                    }
                });
            }

            // Bước 2: Quét toàn bộ các lớp để tìm học sinh
            Object.keys(appData.classes).forEach(classId => {
                const cls = appData.classes[classId];
                if (cls.students && cls.students.length > 0) {
                    cls.students.forEach(student => {
                        const sName = (student.name || '').toLowerCase().trim();
                        const sCode = (student.code || '').toLowerCase();
                        
                        // Khớp nếu tên/mã chứa từ khóa, HOẶC tên nằm trong danh sách đã quét được qua SĐT
                        let isMatch = sName.includes(q) || sCode.includes(q);
                        
                        if (!isMatch) {
                            for (let mn of matchingNames) {
                                if (sName.includes(mn) || mn.includes(sName)) {
                                    isMatch = true;
                                    break;
                                }
                            }
                        }

                        if (isMatch) {
                            // Lấy thêm số điện thoại từ bảng tổng (nếu có) để hiển thị cho đẹp
                            let displayPhone = student.phone || student.code || '---';
                            if (displayPhone === '---' || displayPhone === student.code) {
                                const gsMatch = (appData.globalStudents || []).find(gs => gs.name && gs.name.toLowerCase().trim() === sName);
                                if (gsMatch && gsMatch.phone) displayPhone = gsMatch.phone;
                            }

                            matchCount++;
                            resultsHtml += `
                                <div onclick="openClass('${classId}')" class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center justify-between shadow-sm hover:shadow-md hover:-translate-y-1 transition-all cursor-pointer group mb-3 mx-2">
                                    <div class="flex items-center gap-4">
                                        ${getAvatarImg(student.avatarUrl, student.name, "w-12 h-12")}
                                        <div>
                                            <div class="font-black text-slate-800 text-lg">${student.name}</div>
                                            <div class="text-sm font-bold text-slate-500 mt-0.5">SĐT / Mã: <span class="text-indigo-500">${displayPhone}</span></div>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-1">ĐANG HỌC LỚP</div>
                                        <div class="bg-blue-50 text-blue-600 font-black px-4 py-2 rounded-xl text-sm border border-blue-100 group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-sm">${cls.admin.className || 'Chưa đặt tên'}</div>
                                    </div>
                                </div>
                            `;
                        }
                    });
                }
            });

            if (matchCount === 0) {
                contentArea.innerHTML = `
                    <div class="py-20 text-center flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-[2rem] bg-white/50 mx-2">

        // --- Helper functions for the new Points Form ---

            if (key === 'actionType') {
                state.pointsForm.pointsVal = 0;
                state.pointsForm.reason = '';
            }
            renderLayout();

        // --- Validate input dynamically to prevent full re-render on typing ---
        window.validatePointsForm = function() {
            const pf = state.pointsForm;
            let canSubmit = false;
            
            if (pf.pointsVal > 0 && pf.reason.trim() !== '') {
                if (pf.targetType === 'class') canSubmit = true;
                else if (pf.selectedTargetId) canSubmit = true;
            }

            const btn = document.getElementById('points-submit-btn');
            const badge = document.getElementById('points-preview-badge');

            if (btn) {
                if (canSubmit) {
                    btn.disabled = false;
                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-emerald-600 text-white hover:bg-emerald-700";

                    btn.className = "px-8 py-3.5 font-black rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm hover:-translate-y-0.5 bg-slate-300 text-slate-500 cursor-not-allowed opacity-70";

            }
            
            if (badge) {
                const sign = pf.actionType === 'add' ? '+' : '-';
                badge.innerText = `${sign}${pf.pointsVal > 0 ? pf.pointsVal : 0}đ`;
            }
        };

        window.applyQuickCriterion = function(reason, points, category) {
            state.pointsForm.reason = reason;
            state.pointsForm.pointsVal = points;
            state.pointsForm.category = category || 'Khác';
            renderLayout();
        };

        window.resetPointsForm = function() {
            state.pointsForm = {
                actionType: 'add', targetType: 'student', selectedTargetId: '', pointsVal: 0, category: 'Học tập', reason: '', note: ''
            };
            renderLayout();
        };

       window.executePointsSubmission = function() {
            const pf = state.pointsForm;
            const pointsToApply = pf.actionType === 'add' ? parseInt(pf.pointsVal) : -parseInt(pf.pointsVal);
            
            if (isNaN(pointsToApply) || pointsToApply === 0) return showToast("Số điểm không hợp lệ!", "error");
            if (!pf.reason.trim()) return showToast("Vui lòng nhập lý do!", "error");
            let targetStudents = [];
            let successMsg = "";
            
            if (pf.targetType === 'student') {
                const s = state.students.find(x => x.id.toString() === pf.selectedTargetId.toString());
                if (!s) return showToast("Vui lòng chọn học sinh!", "error");
                targetStudents.push(s);
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho ${s.name}`;
            } 
            else if (pf.targetType === 'group') {
                targetStudents = state.students.filter(x => x.group === pf.selectedTargetId);
                if (targetStudents.length === 0) return showToast(`Nhóm ${pf.selectedTargetId} chưa có học sinh!`, "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Tổ ${pf.selectedTargetId}`;
            } 
            else if (pf.targetType === 'class') {
                targetStudents = [...state.students];
                if (targetStudents.length === 0) return showToast("Lớp chưa có học sinh!", "error");
                successMsg = `Đã ${pf.actionType === 'add' ? 'cộng' : 'trừ'} ${Math.abs(pointsToApply)} điểm cho Toàn Lớp`;
            }
            
            // --- TÍNH NĂNG TỰ ĐỘNG HỌC MẪU MỚI ---
            const currentReason = pf.reason.trim();
            const absVal = Math.abs(pointsToApply);
            const targetCriteriaList = pf.actionType === 'add' ? state.criteria.positive : state.criteria.negative;
            
            // Kiểm tra xem mẫu này đã có trong danh sách chưa (so sánh chữ không phân biệt hoa thường và số điểm)
            const isExist = targetCriteriaList.find(c => c.reason.toLowerCase() === currentReason.toLowerCase() && c.points === absVal);
            if (!isExist) {
                targetCriteriaList.push({
                    points: absVal,
                    reason: currentReason,
                    category: pf.category || 'Khác'
                });
            }
            // --- KẾT THÚC ---

            // Apply points and log history
            const historyEntry = {
                id: Date.now(),
                date: new Date().toISOString(),
                points: pointsToApply,
                reason: currentReason + (pf.note ? ` (${pf.note.trim()})` : '') + ` [${pf.category}]`
            };
            targetStudents.forEach(s => {
                s.points = Math.max(0, (s.points || 0) + pointsToApply);
                s.stars = Math.max(0, (s.stars || 0) + pointsToApply);
                if (!s.history) s.history = [];
                s.history.push({...historyEntry, id: Date.now() + Math.random()}); // Ensure unique IDs if bulk
            });
            saveData();
            
            // Reset form partly for continuous use
            state.pointsForm.pointsVal = 0;
            state.pointsForm.reason = '';
            state.pointsForm.note = '';
            
            renderLayout();
            showToast(successMsg, pointsToApply > 0 ? "success" : "error");
            if (pointsToApply > 0) triggerConfetti();
        };

        function selectStudentForRewards(id) { state.selectedStudentForRewards = id; renderLayout(); }

        // Keeping these two logic functions just in case they are referenced somewhere else historically
        function awardPoints(points, reason) {
            console.log('Legacy awardPoints called, routing to form...', points, reason);
        }
        function awardCustomPoints() {
            console.log('Legacy custom points called');
        }
        function saveNewCriterion() {
            const val = state.pointsForm.pointsVal;
            const reason = state.pointsForm.reason.trim();
            const category = state.pointsForm.category;
            
            if (isNaN(val) || val <= 0) return showToast("Vui lòng nhập số điểm > 0 để lưu mẫu!", "error");
            if (!reason) return showToast("Vui lòng nhập lý do tiêu chí!", "error");
            
            if (state.pointsForm.actionType === 'add') {
                state.criteria.positive.push({ points: val, reason: reason, category: category });
            } else {
                state.criteria.negative.push({ points: val, reason: reason, category: category });
            }
            saveData(); renderLayout(); showToast("Đã lưu tiêu chí mới thành công!");
        }
        
        function deleteCriterion(type, index) {
            if (confirm("Xóa tiêu chí này khỏi danh sách?")) { state.criteria[type].splice(index, 1); saveData(); renderLayout(); showToast("Đã xóa"); }
        }

        function renderViewDoiQua() {
            const selectedStudentId = state.selectedStudentForRewards || null;
            const student = state.students.find(s => s.id === selectedStudentId);
            const sortedStudents = [...state.students].sort((a, b) => (b.stars||0) - (a.stars||0));
            
            const studentListHtml = sortedStudents.map(s => `
                <button onclick="selectStudentForRewards(${s.id})" class="flex-shrink-0 w-32 rounded-2xl flex flex-col items-center justify-center p-4 transition-all duration-300 relative overflow-hidden group ${s.id === selectedStudentId ? 'bg-gradient-to-b from-blue-50 to-white border-2 border-blueAccent shadow-md transform -translate-y-2' : 'border border-slate-200 hover:bg-slate-50 bg-white hover:shadow-sm'}">
                    ${s.id === selectedStudentId ? '<div class="absolute top-0 w-full h-1 bg-blueAccent"></div>' : ''}
                    ${getAvatarImg(s.avatarUrl, s.name, "w-14 h-14 ring-2 ring-slate-100 shadow-sm mb-3 group-hover:scale-110 transition-transform")}
                    <div class="text-sm font-bold text-slate-800 truncate w-full text-center mb-2">${s.name.split(' ').pop()}</div>
                    <div class="text-xs font-black px-3 py-1 rounded-xl bg-orange-50 text-orange-600 border border-orange-100 flex items-center justify-center gap-1.5 w-full"><i class="ph-fill ph-star text-accent"></i> ${s.stars || 0}</div>
                </button>
            `).join('');

       window.currentSessionId = window.currentSessionId || null;

        window.createNewSession = function() {
            const sessionCount = state.sessions ? state.sessions.length + 1 : 1;
            const newSession = {
                id: 'session_' + Date.now(),
                name: 'Buổi ' + sessionCount,
                date: getTodayString(),

            };
            if (!state.sessions) state.sessions = [];
            state.sessions.push(newSession);

            if (!state.attendanceRecords) state.attendanceRecords = {};
            state.attendanceRecords[window.currentSessionId] = {};
            
            saveData(); renderLayout();
            showToast(`Đã thêm ${newSession.name} thành công!`, "success");
        };
        // Hàm đánh số lại toàn bộ các buổi học theo đúng thứ tự
        window.reindexSessions = function() {
            if (state.sessions && state.sessions.length > 0) {
                state.sessions.forEach((s, idx) => {
                    s.name = 'Buổi ' + (idx + 1);
                });
            }
        };

        // Hàm chèn thêm 1 buổi ngay sau buổi hiện tại
        window.insertSessionAfter = function(sessionId) {
            const index = state.sessions.findIndex(s => s.id === sessionId);
            if (index === -1) return;

            const newSession = {
                id: 'session_' + Date.now(),
                name: '', 
                date: getTodayString(),
                content: ''
            };

            // Chèn buổi mới vào vị trí index + 1
            state.sessions.splice(index + 1, 0, newSession);
            
            // Cập nhật lại số thứ tự toàn bộ các buổi (Buổi 1, Buổi 2...)
            window.reindexSessions();
            
            window.currentSessionId = newSession.id;
            if (!state.attendanceRecords) state.attendanceRecords = {};
            state.attendanceRecords[window.currentSessionId] = {};

            saveData(); 
            renderLayout();
            showToast(`Đã chèn thêm ${newSession.name} thành công!`, "success");
        };

        // Hàm xóa buổi học (Cập nhật có thêm tự động đánh số lại)
        window.deleteSession = function(sessionId) {
            if (!state.sessions || state.sessions.length <= 1) {
                return showToast("Không thể xóa buổi học cuối cùng!", "error");
            }
            const session = state.sessions.find(s => s.id === sessionId);
            if (!session) return;

            if (confirm(`Bạn có chắc chắn muốn xóa "${session.name}" cùng toàn bộ dữ liệu điểm danh của buổi này không?`)) {
                state.sessions = state.sessions.filter(s => s.id !== sessionId);
                if (state.attendanceRecords && state.attendanceRecords[sessionId]) {
                    delete state.attendanceRecords[sessionId];
                }
                
                // Đánh lại số thứ tự sau khi xóa để không bị mất liền mạch
                window.reindexSessions();

                if (window.currentSessionId === sessionId) {
                    window.currentSessionId = state.sessions[state.sessions.length - 1].id;
                }
                saveData(); 
                renderLayout();
                showToast(`Đã xóa thành công!`, "success");
            }
        };

            const session = state.sessions.find(s => s.id === sessionId);
            if(session) { session.date = newDate; saveData(); showToast("Đã cập nhật ngày học!", "success"); }

            let currentStatus = typeof currentData === 'object' ? currentData.status : currentData;
            let currentBtvn = typeof currentData === 'object' ? (currentData.btvn || null) : null;
            state.attendanceRecords[window.currentSessionId][id] = { status: currentStatus, note: note, btvn: currentBtvn };

            let currentBtvn = typeof currentData === 'object' ? (currentData.btvn || null) : null;
            
            if (currentBtvn === btvnStatus) {
                state.attendanceRecords[window.currentSessionId][id] = { status: currentStatus, note: currentNote, btvn: null };

            let currentStatus = typeof currentData === 'object' ? currentData.status : currentData;

    const alignCenter = { vertical: "center", horizontal: "center", wrapText: true };
    
    const styleCell = { font: fontDefault, alignment: alignCenter, border: borderAll };
    const styleInfoLabel = { font: fontBold, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "F4B084" } } }; 
    const styleInfoVal = { font: fontDefault, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "DDEBF7" } } }; 
    const styleHeaderGreen = { font: fontWhiteBold, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "385D3A" } } }; 
    const styleHeaderYellow = { font: fontBold, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "FFD966" } } }; 
    
    const createCell = (val, style) => ({ v: val !== null && val !== undefined ? val : '', s: style });
    const wsData = [];
    const formatDateForExcel = (dStr) => {
        if (!dStr) return '';
        const p = dStr.split('-');
        if (p.length !== 3) return dStr;
        return `${p[2]}/${p[1]}/${p[0]}`;
    };

    wsData.push([
        createCell('', {}), createCell('Lớp :', styleInfoLabel), createCell(state.admin.className || '', styleInfoVal),
        createCell('', styleInfoVal), createCell('', styleInfoVal)  
    ]);
    wsData.push([
        createCell('', {}), createCell('Lịch học:', styleInfoLabel), createCell(state.admin.scheduleDay || '', styleInfoVal),
        createCell('', styleInfoVal), createCell('', styleInfoVal)
    ]);
    wsData.push([
        createCell('', {}), createCell('Giáo viên :', styleInfoLabel), createCell(state.admin.name || '', styleInfoVal),
        createCell('', styleInfoVal), createCell('', styleInfoVal)
    ]);
    wsData.push([]); 

    const headerRow = [
        createCell('STT', styleHeaderGreen), createCell('Tên', styleHeaderGreen)
    ];
    state.sessions.forEach((s, idx) => {
        headerRow.push(createCell(idx + 1, styleHeaderGreen));
    });
    
    // Thêm cột tổng
    headerRow.push(createCell('Tổng học ở các lớp', styleHeaderGreen));
    wsData.push(headerRow);

    state.students.forEach((student, index) => {
        const row = [createCell(index + 1, styleCell), createCell(student.name, styleCell)];
        
        state.sessions.forEach(session => {
            const record = (state.attendanceRecords[session.id] || {})[student.id];
            const status = typeof record === 'object' ? record.status : record;
            let mark = '';
            if (status === 'present') mark = 'v';
            else if (status === 'excused') mark = 'P';
            else if (status === 'unexcused') mark = 'KP';
            else if (status === 'late') mark = 'M';
            row.push(createCell(mark, styleCell));
        });

        // Tính tổng số buổi các lớp
        let totalAttendedAllClasses = 0;
        const searchName = (student.name || '').trim().toLowerCase();
        if (appData && appData.classes) {
            Object.values(appData.classes).forEach(cls => {
                if (cls.students && cls.attendanceRecords) {
                    const matchedStudent = cls.students.find(s => (s.name || '').trim().toLowerCase() === searchName);
                    if (matchedStudent) {
                        Object.values(cls.attendanceRecords).forEach(sessionRecord => {
                            const rec = sessionRecord[matchedStudent.id];
                            if (rec) {
                                const status = typeof rec === 'object' ? rec.status : rec;
                                if (status === 'present' || status === 'late' || status === 'excused' || status === 'unexcused') {
                                    totalAttendedAllClasses++;
                                }
                            }
                        });
                    }
                }
            });
        }
        row.push(createCell(totalAttendedAllClasses, styleCell));
        wsData.push(row);
    });
    
    wsData.push([]); 
    wsData.push([
        createCell('Buổi', styleHeaderYellow), createCell('Ngày', styleHeaderYellow), createCell('Nội dung buổi học', styleHeaderYellow), 
        createCell('', {}), createCell('Buổi', styleHeaderYellow), createCell('Ngày', styleHeaderYellow), createCell('Nội dung buổi học', styleHeaderYellow)
    ]);
    
    const half = Math.ceil(state.sessions.length / 2);
    for (let i = 0; i < half; i++) {
        const row = [];
        const s1 = state.sessions[i];
        row.push(createCell(i + 1, styleCell)); row.push(createCell(formatDateForExcel(s1.date), styleCell)); row.push(createCell(s1.content || '', styleCell));
        row.push(createCell('', {})); 
        const rightIndex = i + half;
        if (rightIndex < state.sessions.length) {
            const s2 = state.sessions[rightIndex];
            row.push(createCell(rightIndex + 1, styleCell)); row.push(createCell(formatDateForExcel(s2.date), styleCell)); row.push(createCell(s2.content || '', styleCell));
        } else {
            row.push(createCell('', styleCell)); row.push(createCell('', styleCell)); row.push(createCell('', styleCell));
        }
        wsData.push(row);
    }
    
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!merges'] = [{ s: { r: 0, c: 2 }, e: { r: 0, c: 4 } }, { s: { r: 1, c: 2 }, e: { r: 1, c: 4 } }, { s: { r: 2, c: 2 }, e: { r: 2, c: 4 } }];
    ws['!cols'] = [{ wch: 6 }, { wch: 25 }, { wch: 45 }, { wch: 4 }, { wch: 6 }, { wch: 15 }, { wch: 45 }];
    
    XLSX.utils.book_append_sheet(wb, ws, "DiemDanh");
    XLSX.writeFile(wb, `DiemDanh_${state.admin.className || 'Lop'}_${getTodayString()}.xlsx`);
    showToast("Đã xuất file Excel lớp thành công!", "success");
};

// --- 2. HÀM XUẤT EXCEL CÁ NHÂN (XUẤT LỊCH SỬ HỌC TẤT CẢ CÁC LỚP CỦA 1 HỌC VIÊN) ---
window.exportStudentAttendanceAllClasses = function(studentName) {
    if (!studentName) return showToast("Không tìm thấy tên học viên!", "error");

    const targetName = studentName.trim().toLowerCase();
    let allSessions = [];
    let totalAttended = 0;

    if (appData && appData.classes) {
        Object.keys(appData.classes).forEach(classId => {
            const cls = appData.classes[classId];
            if (cls.students && cls.sessions && cls.attendanceRecords) {
                const matchedStudent = cls.students.find(s => (s.name || '').trim().toLowerCase() === targetName);
                if (matchedStudent) {
                    cls.sessions.forEach(session => {
                        const record = (cls.attendanceRecords[session.id] || {})[matchedStudent.id];
                        const status = typeof record === 'object' ? record.status : record;
                        const note = typeof record === 'object' ? (record.note || '') : '';
                        
                        if (status) {
                            allSessions.push({
                                className: cls.admin.className || 'Chưa đặt tên', date: session.date,
                                sessionName: session.name, content: session.content || '', status: status, note: note
                            });
                            if (['present', 'late', 'excused', 'unexcused'].includes(status)) {
                                totalAttended++;
                            }
                        }
                    });
                }
            }
        });
    }

    if (allSessions.length === 0) return showToast("Học viên này chưa có dữ liệu điểm danh!", "error");
    allSessions.sort((a, b) => new Date(a.date) - new Date(b.date));

    const wb = XLSX.utils.book_new();
    const borderAll = { top: { style: "thin" }, bottom: { style: "thin" }, left: { style: "thin" }, right: { style: "thin" } };
    const fontDefault = { name: "Times New Roman", sz: 12 };
    const fontBold = { name: "Times New Roman", sz: 12, bold: true };
    const styleCell = { font: fontDefault, alignment: { vertical: "center", horizontal: "center", wrapText: true }, border: borderAll };
    const styleCellLeft = { font: fontDefault, alignment: { vertical: "center", horizontal: "left", wrapText: true }, border: borderAll };
    const styleHeaderGreen = { font: { name: "Times New Roman", sz: 12, bold: true, color: { rgb: "FFFFFF" } }, alignment: { vertical: "center", horizontal: "center", wrapText: true }, border: borderAll, fill: { fgColor: { rgb: "385D3A" } } };
    
    const createCell = (val, style) => ({ v: val !== null && val !== undefined ? val : '', s: style });
    const wsData = [];
    
    wsData.push([createCell("BẢNG TỔNG HỢP ĐIỂM DANH HỌC VIÊN (TẤT CẢ CÁC LỚP)", { font: { name: "Times New Roman", sz: 14, bold: true }, alignment: { horizontal: "center" } })]);
    wsData.push([]);
    wsData.push([createCell("Họ và tên:", fontBold), createCell(studentName, fontDefault)]);
    wsData.push([createCell("Tổng số buổi đã sử dụng:", fontBold), createCell(totalAttended, { font: { name: "Times New Roman", sz: 13, bold: true, color: { rgb: "FF0000" } } })]);
    wsData.push([]);
    
    wsData.push([
        createCell("STT", styleHeaderGreen), createCell("Lớp học", styleHeaderGreen), createCell("Ngày học", styleHeaderGreen),
        createCell("Tên buổi", styleHeaderGreen), createCell("Trạng thái", styleHeaderGreen), createCell("Nội dung buổi học", styleHeaderGreen), createCell("Ghi chú", styleHeaderGreen)
    ]);
    
    const formatStatus = (st) => {
        if(st === 'present') return 'Có mặt (v)'; if(st === 'excused') return 'Vắng phép (P)';
        if(st === 'unexcused') return 'Vắng không phép (KP)'; if(st === 'late') return 'Muộn (M)'; return '';
    };
    const formatDate = (dStr) => {
        if (!dStr) return ''; const p = dStr.split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : dStr;
    };

    allSessions.forEach((ss, idx) => {
        wsData.push([
            createCell(idx + 1, styleCell), createCell(ss.className, styleCell), createCell(formatDate(ss.date), styleCell),
            createCell(ss.sessionName, styleCell), createCell(formatStatus(ss.status), styleCell), createCell(ss.content, styleCellLeft), createCell(ss.note, styleCellLeft)
        ]);
    });
    
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 6 } }];
    ws['!cols'] = [{ wch: 5 }, { wch: 20 }, { wch: 12 }, { wch: 10 }, { wch: 20 }, { wch: 45 }, { wch: 25 }];
    
    XLSX.utils.book_append_sheet(wb, ws, "ChiTietDiemDanh");
    const safeName = studentName.replace(/[^a-zA-Z0-9\s]/g, '').trim();
    XLSX.writeFile(wb, `DiemDanh_CaNhan_${safeName}_${new Date().getTime()}.xlsx`);
    showToast(`Đã xuất file điểm danh cá nhân cho ${studentName}!`, "success");
};

// --- NEW RANDOM PICKER ENGINE VARIABLES ---

        window.changePickerMode = function(mode) { pickerMode = mode; renderLayout(); }
        window.changePickerBg = function(bg) { pickerBg = bg; renderLayout(); }
        window.changePickTarget = function(target) { pickTarget = target; renderLayout(); }

        function initPickerCards() {
            const stage = document.getElementById('picker-stage');
            if (!stage) return;
            stage.innerHTML = ''; // Clear old cards
            
            const listItems = pickTarget === 'student' ? state.students : state.groups;
            if(listItems.length === 0) {
                stage.innerHTML = `<div class="absolute inset-0 flex items-center justify-center text-xl font-bold ${pickerBg === 'default' ? 'text-slate-400' : 'text-white/50'}">Chưa có dữ liệu.</div>`;

            pickerItems = listItems.map((item, index) => {
                const el = document.createElement('div');
                el.className = `absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white rounded-2xl p-3 shadow-lg flex flex-col items-center justify-center gap-2 transition-transform border border-slate-100 will-change-transform z-10`;
                el.style.width = '110px';

                const colors = ['#f59e0b', '#10b981', '#3b82f6', '#ec4899', '#8b5cf6'];
                const borderColor = colors[index % colors.length];

                el.innerHTML = `
                    <div class="rounded-full p-1" style="background: linear-gradient(135deg, ${borderColor} 0%, transparent 100%);">
                        ${avatarHtml}

                    <div class="text-xs font-black text-slate-800 text-center w-full truncate leading-tight pointer-events-none">${item.name}</div>
                `;
                
                stage.appendChild(el);

                // Initial random positions
                const stageWidth = stage.offsetWidth;
                const stageHeight = stage.offsetHeight;
                
                return {
                    el: el,
                    data: item,
                    x: (Math.random() - 0.5) * (stageWidth - 150),
                    y: (Math.random() - 0.5) * (stageHeight - 150),
                    angle: Math.random() * Math.PI * 2,
                    speed: 0.5 + Math.random() * 1.5,
                    radius: 50 + Math.random() * 200, // for spiral/planet
                    baseX: 0, baseY: 0 // offset
                };
            });
        }

        function animatePicker() {
            if(!pickerItems.length) return;
            const stage = document.getElementById('picker-stage');
            if (!stage) { cancelAnimationFrame(pickerAnimationId); return; }
            
            const stageWidth = stage.offsetWidth;
            const stageHeight = stage.offsetHeight;
            const time = performance.now() / 1000; // time in seconds

            pickerItems.forEach((item, i) => {
                // Tốc độ thay đổi dựa trên việc có đang Pick (quay số) hay không
                const speedMulti = isPicking ? 8 : 1; 

                if (pickerMode === 'chaos') {
                    item.x += Math.cos(item.angle) * item.speed * speedMulti;
                    item.y += Math.sin(item.angle) * item.speed * speedMulti;
                    // Bouncing off walls
                    const boundX = stageWidth/2 - 60;
                    const boundY = stageHeight/2 - 70;
                    if (item.x > boundX || item.x < -boundX) item.angle = Math.PI - item.angle;
                    if (item.y > boundY || item.y < -boundY) item.angle = -item.angle;
                    
                    // Add some random noise
                    item.angle += (Math.random() - 0.5) * 0.1 * speedMulti;
                } 
                else if (pickerMode === 'spiral') {
                    const t = time * item.speed * speedMulti + i;
                    const r = (Math.sin(time * 0.5) * 0.5 + 0.5) * 300 + 50; // Radius expands and contracts
                    item.x = Math.cos(t) * r;
                    item.y = Math.sin(t) * r;
                }
                else if (pickerMode === 'planet') {
                    // Center is sun, others orbit
                    const t = time * (item.speed/2) * speedMulti;
                    item.x = Math.cos(t + i) * item.radius;
                    item.y = Math.sin(t + i) * item.radius;
                }
                else if (pickerMode === 'wave') {
                    item.x += item.speed * speedMulti * 2;
                    if(item.x > stageWidth/2 + 60) item.x = -stageWidth/2 - 60; // wrap around
                    item.y = Math.sin(item.x / 100 + time * 5) * 150;
                }
                else if (pickerMode === 'bubbles') {
                    item.y -= item.speed * speedMulti * 2;
                    if(item.y < -stageHeight/2 - 70) item.y = stageHeight/2 + 70;
                    item.x = Math.sin(item.y / 50 + time * 3 + i) * 100 + item.baseX;
                }
                else if (pickerMode === 'figure8') {
                    const t = time * item.speed * speedMulti + i;
                    item.x = Math.sin(t) * (stageWidth/3);
                    item.y = Math.sin(t) * Math.cos(t) * (stageHeight/3);
                }

                // Keep within bounds roughly
                item.x = Math.max(-stageWidth/2 + 55, Math.min(stageWidth/2 - 55, item.x));
                item.y = Math.max(-stageHeight/2 + 65, Math.min(stageHeight/2 - 65, item.y));

                // Apply transform relative to center
                item.el.style.transform = `translate(calc(-50% + ${item.x}px), calc(-50% + ${item.y}px))`;
            });

            if(!isPicking || performance.now() < pickEndTime) {
                pickerAnimationId = requestAnimationFrame(animatePicker);
            }
        }

        let pickEndTime = 0;
        window.startPicking = function() {
            if(pickerItems.length === 0) return showToast("Chưa có danh sách!", "error");
            if(isPicking) return;
            
            isPicking = true;
            document.getElementById('btn-start-pick').innerHTML = `<i class="ph-bold ph-spinner-gap text-2xl animate-spin"></i> ĐANG GỌI...`;
            document.getElementById('btn-start-pick').classList.replace('bg-emerald-600', 'bg-slate-400');
            
            // Start sounds
            if (Tone.context.state !== 'running') Tone.start();
            let clickSynth = null;
            try { clickSynth = new Tone.Synth({ oscillator: { type: 'square' }, envelope: { attack: 0.01, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); clickSynth.volume.value = -15; } catch(e) {}
            
            let soundInterval = setInterval(() => {
                if(clickSynth && Tone.context.state === 'running') clickSynth.triggerAttackRelease("G5", "32n", Tone.now());
            }, 150);

            pickEndTime = performance.now() + (pickerTime * 1000);

            setTimeout(() => {
                clearInterval(soundInterval);
                finishPick();
            }, pickerTime * 1000);
        }

        function finishPick() {

window.exportData = function() {
            // Cập nhật dữ liệu lớp hiện tại vào bộ nhớ tổng trước khi xuất
            if (appData.activeClassId && state) {
                appData.classes[appData.activeClassId] = state;
            }
            // Xuất toàn bộ biến appData thay vì chỉ xuất state
            const dataStr = JSON.stringify(appData, null, 2);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const exportFileDefaultName = `ChuyenTauThanhXuan_ToanBoLop_${getTodayString()}.json`;
            let linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', exportFileDefaultName);
            linkElement.click();
            showToast("Đã tải xuống bản sao lưu TOÀN BỘ lớp!", "success");
        };

        window.importData = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (confirm("Cảnh báo: Dữ liệu của TẤT CẢ CÁC LỚP hiện tại sẽ bị xóa và ghi đè bằng file phục hồi. Bạn có chắc chắn muốn tiếp tục?")) {
                        
                        // Kiểm tra xem file import là bản đa lớp (mới) hay đơn lớp (cũ)
                        if (importedData.classes) {
                            appData = importedData;
                        } else {
                            // Tự động chuyển đổi nếu người dùng tải lên file của 1 lớp cũ
                            const defaultId = 'class_' + Date.now();
                            appData = { classes: { [defaultId]: importedData }, activeClassId: defaultId };
                        }
                        
                        if(appData.activeClassId && appData.classes[appData.activeClassId]) {
                            state = appData.classes[appData.activeClassId];
                            applyStateDefaults();
                        } else {
                            appData.activeClassId = null;
                        }
                        
                        saveData();
                        renderLayout();
                        showToast("Đã phục hồi toàn bộ dữ liệu thành công!", "success");
                        
                        // Đẩy người dùng ra sảnh chính để thấy tất cả các lớp
                        goToLobby();
                    }
                } catch (error) {
                    showToast("File không hợp lệ hoặc bị lỗi định dạng!", "error");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Xóa input để có thể chọn lại cùng file nếu cần
        };
        function saveSettings() { 
            state.admin.className = document.getElementById('setting-classname').value;

            const checkboxes = document.querySelectorAll('input[name="edit-class-days"]:checked');
            const scheduleDays = Array.from(checkboxes).map(cb => cb.value);
            
            // Cập nhật ngày học

            saveData();

        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas'); if (!canvas) return; const container = document.getElementById('main-container');
            canvas.width = container.offsetWidth; canvas.height = container.offsetHeight; const ctx = canvas.getContext('2d');
            const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
            for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+2, dx: Math.random()*16-8, dy: Math.random()*-15-5, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                particles.forEach(p => { if (p.y < canvas.height) active++; p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.2; ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke(); });
                if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
            } render();
        }

        /* Retain rest of logical helpers unmodified to ensure functionality */
        function renderDrawerTimerText() {
            const display = document.getElementById('drawer-timer-display');
            if (display) {
                const span = display.querySelector('span');
                const m = Math.floor(timerSeconds / 60), s = timerSeconds % 60; span.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                if (timerSeconds <= 10 && timerSeconds > 0) span.classList.add('text-red-400', 'animate-pulse'); else span.classList.remove('text-red-400', 'animate-pulse');
            }
        }
        function updateTimerFromInputs() {
            if (isTimerRunning) return; 
            let m = parseInt(document.getElementById('drawer-min-input').value)||0, s = parseInt(document.getElementById('drawer-sec-input').value)||0;
            if (s > 59) { m += Math.floor(s / 60); s = s % 60; } if (m > 99) m = 99;
            document.getElementById('drawer-min-input').value = m; document.getElementById('drawer-sec-input').value = s;
            timerSeconds = m * 60 + s; renderDrawerTimerText();
        }
        function toggleDrawerTimer() {
            const startBtn = document.getElementById('drawer-start-btn');
            if (isTimerRunning) {
                clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Tiếp Tục";
            } else {
                if (timerSeconds <= 0) updateTimerFromInputs(); if (timerSeconds <= 0) return;
                isTimerRunning = true; startBtn.innerText = "Tạm Dừng";
                if (Tone.context.state !== 'running') Tone.start();
                let tickSynth = null;
                try { tickSynth = new Tone.Synth({ oscillator: { type: "square" }, envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination(); tickSynth.volume.value = -15; } catch(e) {}
                timerInterval = setInterval(() => {
                    timerSeconds--; renderDrawerTimerText();
                    if (tickSynth && Tone.context.state === 'running') {
                        if (timerSeconds <= 10 && timerSeconds > 0) tickSynth.triggerAttackRelease("E5", "8n");
                        else if (timerSeconds > 10) tickSynth.triggerAttackRelease("C5", "16n");
                    }
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval); isTimerRunning = false; startBtn.innerText = "Bắt Đầu"; showToast("Hết giờ!", "success");
                        try{ const s = new Tone.PolySynth().toDestination(); s.triggerAttackRelease(['C4','E4','G4'], "1n"); }catch(e){}
                    }
                }, 1000);
            }
        }

        function processImportRows(rows) {
            let addedCount = 0;
            let currentId = state.students.length > 0 ? Math.max(...state.students.map(s => s.id)) + 1 : 1;

                state.students.push({ 
                    id: currentId++, name: name,

                    group: (row[2] || '').toString().trim() || 'Tổ 1',

        function showRandomResultModal(title, htmlContent) {
            document.getElementById('modal-container').innerHTML = `
                <div class="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in" id="random-result-modal">
                    <div class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden"><canvas id="modal-confetti-canvas" class="w-full h-full"></canvas></div>
                    <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col relative text-center pt-10 pb-12 px-6 z-10 animate-[popIn_0.5s_cubic-bezier(0.16,1,0.3,1)_forwards]">

                        <div class="inline-block px-4 py-1.5 rounded-full bg-accent/10 border border-accent/20 text-accent font-black text-xs uppercase tracking-widest mx-auto mb-4">Kết quả lựa chọn</div>

                        <div class="flex flex-wrap justify-center gap-8 px-4 max-h-[60vh] overflow-y-auto custom-scrollbar">${htmlContent}</div>
                    </div>
                </div>
            `;
            setTimeout(() => {
                const canvas = document.getElementById('modal-confetti-canvas'); if (!canvas) return;
                canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
                const ctx = canvas.getContext('2d');
                const particles = [], colors = ['#3b82f6', '#f59e0b', '#10b981', '#ec4899', '#8b5cf6'];
                for (let i = 0; i < 150; i++) particles.push({ x: canvas.width/2, y: canvas.height/2+50, r: Math.random()*6+3, dx: Math.random()*16-8, dy: Math.random()*-15-8, color: colors[Math.floor(Math.random()*colors.length)], tilt: Math.floor(Math.random()*10)-10, tiltAngleInc: (Math.random()*0.07)+0.05, tiltAngle: 0 });
                function render() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height); let active = 0;
                    particles.forEach(p => {
                        if (p.y < canvas.height) active++;
                        p.tiltAngle += p.tiltAngleInc; p.y += (Math.cos(p.tiltAngle) + p.dy + p.r/2)/2; p.x += Math.sin(p.tiltAngle)*2 + p.dx; p.dy += 0.25;
                        ctx.beginPath(); ctx.lineWidth = p.r; ctx.strokeStyle = p.color; ctx.moveTo(p.x+p.tilt+p.r, p.y); ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r); ctx.stroke();
                    });
                    if (active > 0) requestAnimationFrame(render); else ctx.clearRect(0, 0, canvas.width, canvas.height);
                } render();
            }, 100);
        }

            let count = 0;
            state.students.forEach(s => {
                let shouldReset = (target === 'all') || (target.startsWith('group_') && s.group === target.replace('group_', '')) || (target.startsWith('student_') && s.id.toString() === target.replace('student_', ''));

            if (!student) return;

            const history = student.history || [];
            // Sắp xếp lịch sử mới nhất lên đầu
            const sortedHistory = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));

            let historyHtml = '';
            if (sortedHistory.length === 0) {

        window.executeMoveStudent = function(studentId) {
            const targetClassId = document.getElementById('move-target-class').value;
            if (!targetClassId || !appData.classes[targetClassId]) {
                return showToast("Lớp đích không hợp lệ!", "error");
            }
            
            const studentIndex = state.students.findIndex(s => s.id === studentId);
            if (studentIndex === -1) return;
            
            const student = state.students[studentIndex];
            const targetClass = appData.classes[targetClassId];
            
            // Xóa ở lớp cũ
            state.students.splice(studentIndex, 1);
            
            // Đóng gói và chuẩn bị ID mới cho lớp đích
            const studentCopy = JSON.parse(JSON.stringify(student));
            if(!targetClass.students) targetClass.students = [];
            const newId = targetClass.students.length > 0 ? Math.max(...targetClass.students.map(s => s.id)) + 1 : 1;
            
            studentCopy.id = newId;
            // Cho học sinh vào tổ đầu tiên của lớp đích (hoặc tổ mặc định)
            studentCopy.group = (targetClass.groups && targetClass.groups.length > 0) ? targetClass.groups[0].name : "Chưa nhóm";
            
            // Chèn vào lớp mới
            targetClass.students.push(studentCopy);
            
            // Lưu dữ liệu tổng thể
            saveData();
            closeModal('move-student-modal');
            renderLayout(); // Tự tải lại giao diện lớp cũ
            
            showToast(`Đã chuyển ${student.name} sang ${targetClass.admin.className} thành công!`, "success");
        };
    window.exportAttendanceToExcel = function() {
            if (!state.sessions || state.sessions.length === 0) {
                return showToast("Chưa có buổi học nào để xuất!", "error");
            }

            const wb = XLSX.utils.book_new();

            // --- 0. ĐỊNH NGHĨA CÁC STYLE (MÀU SẮC, FONT, KẺ BẢNG) ---
            const borderAll = {
                top: { style: "thin", color: { rgb: "000000" } },
                bottom: { style: "thin", color: { rgb: "000000" } },
                left: { style: "thin", color: { rgb: "000000" } },
                right: { style: "thin", color: { rgb: "000000" } }
            };
            const fontDefault = { name: "Times New Roman", sz: 13 };
            const fontBold = { name: "Times New Roman", sz: 13, bold: true };
            const fontWhiteBold = { name: "Times New Roman", sz: 13, bold: true, color: { rgb: "FFFFFF" } };
            const alignCenter = { vertical: "center", horizontal: "center", wrapText: true };
            
            // Các nhóm style áp dụng cho từng loại ô
            const styleCell = { font: fontDefault, alignment: alignCenter, border: borderAll };
            const styleInfoLabel = { font: fontBold, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "F4B084" } } }; // Màu cam nhạt
            const styleInfoVal = { font: fontDefault, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "DDEBF7" } } }; // Màu xanh nhạt
            const styleHeaderGreen = { font: fontWhiteBold, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "385D3A" } } }; // Xanh lá đậm
            const styleHeaderYellow = { font: fontBold, alignment: alignCenter, border: borderAll, fill: { fgColor: { rgb: "FFD966" } } }; // Vàng

            // Hàm hỗ trợ bọc giá trị cùng với style
            const createCell = (val, style) => ({ v: val !== null && val !== undefined ? val : '', s: style });

            const wsData = [];

            const formatDateForExcel = (dStr) => {
                if (!dStr) return '';
                const p = dStr.split('-');
                if (p.length !== 3) return dStr;
                return `${p[2]}/${p[1]}/${p[0]}`;
            };

            // --- 1. THÔNG TIN LỚP HỌC ---
            wsData.push([
                createCell('', {}), // Ô A1 trống
                createCell('Lớp :', styleInfoLabel), 
                createCell(state.admin.className || '', styleInfoVal),
                createCell('', styleInfoVal), // Để Merge
                createCell('', styleInfoVal)  // Để Merge
            ]);
            wsData.push([
                createCell('', {}), 
                createCell('Lịch học:', styleInfoLabel), 
                createCell(state.admin.scheduleDay || '', styleInfoVal),
                createCell('', styleInfoVal),
                createCell('', styleInfoVal)
            ]);
            wsData.push([
                createCell('', {}), 
                createCell('Giáo viên :', styleInfoLabel), 
                createCell(state.admin.name || '', styleInfoVal),
                createCell('', styleInfoVal),
                createCell('', styleInfoVal)
            ]);
            wsData.push([]); // Dòng trống cách điệu

            // --- 2. TIÊU ĐỀ CỘT ĐIỂM DANH ---
            const headerRow = [
                createCell('STT', styleHeaderGreen), 
                createCell('Tên', styleHeaderGreen)
            ];
            state.sessions.forEach((s, idx) => {
                headerRow.push(createCell(idx + 1, styleHeaderGreen));
            });
            wsData.push(headerRow);

            // --- 3. DỮ LIỆU ĐIỂM DANH HỌC SINH ---
            state.students.forEach((student, index) => {
                const row = [
                    createCell(index + 1, styleCell), 
                    createCell(student.name, styleCell)
                ];
                state.sessions.forEach(session => {
                    const record = (state.attendanceRecords[session.id] || {})[student.id];
                    const status = typeof record === 'object' ? record.status : record;
                    let mark = '';
                    if (status === 'present') mark = 'v';
                    else if (status === 'excused') mark = 'P';
                    else if (status === 'unexcused') mark = 'KP';
                    else if (status === 'late') mark = 'M';
                    row.push(createCell(mark, styleCell));
                });
                wsData.push(row);
            });

            wsData.push([]); // Dòng phân cách

            // --- 4. BẢNG CHI TIẾT NỘI DUNG BUỔI HỌC (2 CỘT) ---
            wsData.push([
                createCell('Buổi', styleHeaderYellow), 
                createCell('Ngày', styleHeaderYellow), 
                createCell('Nội dung buổi học', styleHeaderYellow), 
                createCell('', {}), // Khoảng trống ở giữa
                createCell('Buổi', styleHeaderYellow), 
                createCell('Ngày', styleHeaderYellow), 
                createCell('Nội dung buổi học', styleHeaderYellow)
            ]);
            
            const half = Math.ceil(state.sessions.length / 2);
            for (let i = 0; i < half; i++) {
                const row = [];
                
                // Khối Trái
                const s1 = state.sessions[i];
                row.push(createCell(i + 1, styleCell));
                row.push(createCell(formatDateForExcel(s1.date), styleCell));
                row.push(createCell(s1.content || '', styleCell));
                
                row.push(createCell('', {})); // Cột phân cách

                // Khối Phải
                const rightIndex = i + half;
                if (rightIndex < state.sessions.length) {
                    const s2 = state.sessions[rightIndex];
                    row.push(createCell(rightIndex + 1, styleCell));
                    row.push(createCell(formatDateForExcel(s2.date), styleCell));
                    row.push(createCell(s2.content || '', styleCell));
                } else {
                    // Nếu lẻ, lấp đầy các ô trống bằng viền
                    row.push(createCell('', styleCell));
                    row.push(createCell('', styleCell));
                    row.push(createCell('', styleCell));
                }
                
                wsData.push(row);
            }

            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // Gộp ô (Merge cells) cho phần thông tin lớp học (C->E)
            ws['!merges'] = [
                { s: { r: 0, c: 2 }, e: { r: 0, c: 4 } },
                { s: { r: 1, c: 2 }, e: { r: 1, c: 4 } },
                { s: { r: 2, c: 2 }, e: { r: 2, c: 4 } }
            ];

            // Chỉnh độ rộng các cột cho cân đối
            ws['!cols'] = [
                { wch: 6 },  // STT / Buổi
                { wch: 25 }, // Tên / Ngày
                { wch: 45 }, // Nội dung 1 / Tích V
                { wch: 4 },  // Khoảng cách
                { wch: 6 },  // Buổi 2
                { wch: 15 }, // Ngày 2
                { wch: 45 }  // Nội dung 2
            ];

            XLSX.utils.book_append_sheet(wb, ws, "DiemDanh");
            XLSX.writeFile(wb, `DiemDanh_${state.admin.className || 'Lop'}_${getTodayString()}.xlsx`);
            showToast("Đã xuất file Excel thành công!", "success");
        };

window.handleGlobalStudentExcelUpload = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            showToast("Đang đọc dữ liệu từ file...", "success");
            
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const workbook = XLSX.read(evt.target.result, {type: 'binary'});
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    
                    // Thêm raw: false để tự động format ngày tháng (VD: số 38475 thành 24/05/2005)
                    const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: "", raw: false, dateNF: "dd/MM/yyyy"});
                    
                    if(rows.length < 2) {
                        return showToast("File Excel không có dữ liệu!", "error");
                    }

                    // Xóa SẠCH mọi khoảng trắng và dấu xuống dòng ở dòng tiêu đề để bắt khớp 100%
                    const headers = rows[0].map(h => h ? h.toString().toLowerCase().replace(/\s+/g, '') : "");
                    
                    const colName = headers.findIndex(h => h.includes("họvàtên") || h.includes("họcviên"));
                    const colDob = headers.findIndex(h => h.includes("ngày") || h.includes("sinh"));
                    const colSessions = headers.findIndex(h => h.includes("sốbuổi") || h.includes("buổi"));
                    const colParent = headers.findIndex(h => h.includes("phụhuynh") || h.includes("mẹ") || h.includes("bố"));
                    
                    let colPhone = headers.findIndex(h => h.includes("điệnthoạiliênhệ"));
                    if (colPhone === -1) colPhone = headers.findIndex(h => h.includes("điệnthoại") || h.includes("sđt"));
                    
                    const colAddress = headers.findIndex(h => h.includes("địachỉ"));
                    const colSchedule = headers.findIndex(h => h.includes("giờhọc") || h.includes("lịchhọc"));
                    const colGoal = headers.findIndex(h => h.includes("trìnhđộ") || h.includes("mụctiêu"));
                    const colFee = headers.findIndex(h => h.includes("họcphí") || h.includes("đãđóng")); // Bổ sung bắt cột Học phí

                    if (!appData.globalStudents) appData.globalStudents = [];
                    
                    let addedCount = 0;
                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        
                        if (!row || colName === -1 || !row[colName] || row[colName].toString().trim() === '') continue;

                        appData.globalStudents.push({
                            name: colName !== -1 ? row[colName].toString().trim() : "",
                            dob: colDob !== -1 ? row[colDob].toString().trim() : "",
                            sessions: colSessions !== -1 ? row[colSessions].toString().trim() : "",
                            parent: colParent !== -1 ? row[colParent].toString().trim() : "",

                            schedule: colSchedule !== -1 ? row[colSchedule].toString().trim() : "",
                            bgColor: "#ffffff"
                        });
                        addedCount++;
                    }

                    saveData();
                    renderLayout();
                    showToast(`Đã nhập thành công ${addedCount} học viên từ Excel!`, "success");
                    
                    setTimeout(() => {
                        const tableContainer = document.getElementById('global-student-table-container');

                    }, 100);
                    
                } catch(err) {
                    console.error(err);
                    showToast("Lỗi đọc file. Vui lòng tải xuống dạng file .xlsx và thử lại.", "error");
                }
            };
            reader.readAsBinaryString(file);
            e.target.value = ''; 
        }

        window.toggleAllGlobalStudents = function(isChecked) {
            if(!appData.globalStudents) return;
            appData.globalStudents.forEach(s => s.selected = isChecked);
            saveData();
            renderLayout();
        }

        window.deleteSelectedGlobalStudents = function() {
            const selectedCount = appData.globalStudents.filter(s => s.selected).length;
            if(selectedCount === 0) return;
            
            if(confirm(`Bạn có chắc chắn muốn xóa ${selectedCount} học viên đã chọn? Hành động này không thể hoàn tác.`)) {
                appData.globalStudents = appData.globalStudents.filter(s => !s.selected);
                saveData();
                renderLayout();
                showToast(`Đã xóa ${selectedCount} học viên!`, "success");
            }
        }

        window.isDragSelecting = false;
        window.dragSelectMode = true;

        if (!window.dragSelectInitialized) {
            window.addEventListener('mouseup', () => {
                if (window.isDragSelecting) {
                    window.isDragSelecting = false;
                    saveData(); 
                }
            });
            window.dragSelectInitialized = true;
        }

        window.startDragSelect = function(e, idx) {
            if (e.button !== 0) return; // Chỉ nhận chuột trái
            window.isDragSelecting = true;
            const student = appData.globalStudents[idx];
            
            // Xác định trạng thái: Nếu đang chưa chọn thì khi lướt sẽ là Chọn, và ngược lại
            window.dragSelectMode = !student.selected;
            student.selected = window.dragSelectMode;
            
            // Cập nhật DOM trực tiếp (tránh giật lag khi kéo thả)
            const cb = document.querySelector(`.row-selector[data-index="${idx}"]`);
            if(cb) cb.checked = window.dragSelectMode;
            updateBulkDeleteButton();
        }

        window.enterDragSelect = function(e, idx) {
            if (window.isDragSelecting) {
                const student = appData.globalStudents[idx];
                student.selected = window.dragSelectMode;
                
                const cb = document.querySelector(`.row-selector[data-index="${idx}"]`);
                if(cb) cb.checked = window.dragSelectMode;
                updateBulkDeleteButton();
            }
        }

                                    <span contenteditable="true" spellcheck="false" class="editable-val" style="border-bottom: 1px dashed #cbd5e1; padding: 0 5px; min-width: 35px; display: inline-block; text-align: center; outline: none;">${dd}</span> 
                                    <span contenteditable="true" spellcheck="false" style="outline: none;">tháng</span> 
                                    <span contenteditable="true" spellcheck="false" class="editable-val" style="border-bottom: 1px dashed #cbd5e1; padding: 0 5px; min-width: 35px; display: inline-block; text-align: center; outline: none;">${mm}</span> 
                                    <span contenteditable="true" spellcheck="false" style="outline: none;">năm</span> 
                                    <span contenteditable="true" spellcheck="false" class="editable-val" style="border-bottom: 1px dashed #cbd5e1; padding: 0 5px; min-width: 50px; display: inline-block; text-align: center; outline: none;">${yyyy}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('modal-container').innerHTML = modalHtml;
        }

        window.handleInvoiceLogoUpload = function(e) {
            const file = e.target.files[0];
            if (file) {
                compressImage(file, (dataUrl) => {
                    appData.invoiceLogo = dataUrl;
                    document.getElementById('invoice-logo-img').src = dataUrl;
                    saveData();
                }, 500); 
            }
        }

        window.printInvoice = function() {
            // Xóa gạch chân khi in (để nhìn giống văn bản đánh máy)
            const editableSpans = document.querySelectorAll('#printable-invoice .editable-val');
            editableSpans.forEach(span => {
                span.dataset.oldBorder = span.style.borderBottom;
                span.style.borderBottom = 'none';
            });

            const content = document.getElementById('printable-invoice').outerHTML;
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                    <head>
                        <title>In Phiếu Đăng Ký</title>
                        <style>
                            /* Thiết lập in khổ ngang (Landscape) */
                            @page { size: landscape; margin: 10mm; }
                            body { margin: 0; display: flex; justify-content: center; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            .print\\:hidden { display: none !important; }
                        </style>
                    </head>
                    <body>
                        ${content}
                        <script>
                            window.onload = function() { setTimeout(() => { window.print(); window.close(); }, 300); };
                        <\\/script>
                    </body>
                </html>
            `);
            printWindow.document.close();

            // Khôi phục gạch chân sau khi tạo lệnh in
            setTimeout(() => {
                editableSpans.forEach(span => {
                    span.style.borderBottom = span.dataset.oldBorder;
                });
            }, 500);
        }
// ==========================================
// TÍNH NĂNG TRANG TÍNH HỌC VIÊN ĐANG TƯ VẤN
// ==========================================

window.openConsultingStudents = function() {
    window.currentLobbyView = 'consulting-students';
    if(!appData.consultingStudents) appData.consultingStudents = [];
    renderLayout();
}

window.closeConsultingStudents = function() {
    window.currentLobbyView = 'lobby';
    renderLayout();
}

window.addConsultingStudentRow = function() {
    if(!appData.consultingStudents) appData.consultingStudents = [];
    appData.consultingStudents.push({
        name: '', dob: '', phone: '', status: ''
    });
    saveData();
    renderLayout();
}

window.updateConsultingStudent = function(index, field, value) {
    if(appData.consultingStudents[index]) {
        appData.consultingStudents[index][field] = value;
        saveData();
    }
}

window.deleteConsultingStudentRow = function(index) {
    if(confirm('Bạn có chắc chắn muốn xóa học viên này khỏi danh sách tư vấn?')) {
        appData.consultingStudents.splice(index, 1);
        saveData();
        renderLayout();
    }
}

function renderConsultingStudentsView() {
    if(!appData.consultingStudents) appData.consultingStudents = [];

    const rowsHtml = appData.consultingStudents.map((s, idx) => `
        <tr class="border-b border-slate-200 transition-colors hover:bg-slate-50 select-none">
            <td class="p-3 text-center border-r border-slate-200 font-bold text-slate-500">${idx + 1}</td>
            <td class="p-3 border-r border-slate-200 font-bold text-slate-800 outline-none focus:bg-white" contenteditable="true" onblur="updateConsultingStudent(${idx}, 'name', this.innerText)">${s.name || ''}</td>
            <td class="p-3 border-r border-slate-200 outline-none focus:bg-white text-center" contenteditable="true" onblur="updateConsultingStudent(${idx}, 'dob', this.innerText)">${s.dob || ''}</td>
            <td class="p-3 border-r border-slate-200 outline-none focus:bg-white font-medium text-center" contenteditable="true" onblur="updateConsultingStudent(${idx}, 'phone', this.innerText)">${s.phone || ''}</td>
            <td class="p-3 border-r border-slate-200 outline-none focus:bg-white font-bold text-orange-600" contenteditable="true" onblur="updateConsultingStudent(${idx}, 'status', this.innerText)">${s.status || ''}</td>
            <td class="p-3 text-center">
                <button onclick="deleteConsultingStudentRow(${idx})" class="text-slate-400 hover:text-red-500 bg-white/50 hover:bg-red-50 p-2 rounded-xl transition-colors" title="Xóa"><i class="ph-bold ph-trash text-lg"></i></button>
            </td>
        </tr>
    `).join('');

    return `
        <div class="min-h-screen bg-slate-100 p-4 md:p-8 animate-fade-in flex flex-col h-screen">
            <div class="max-w-[1200px] mx-auto w-full flex-1 flex flex-col h-full">
                <!-- Header -->
                <div class="flex justify-between items-center bg-white p-5 rounded-3xl shadow-sm border border-slate-200 mb-6 flex-shrink-0">
                    <div class="flex items-center gap-4">
                        <button onclick="closeConsultingStudents()" class="p-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition-colors" title="Quay lại Sảnh">
                            <i class="ph-bold ph-arrow-left text-xl"></i>
                        </button>
                        <div>
                            <h1 class="text-2xl font-black text-slate-800 tracking-tight">Học Viên Đang Tư Vấn</h1>
                            <p class="text-slate-500 text-sm font-medium">Bảng theo dõi và chăm sóc học viên mới</p>
                        </div>
                    </div>
                    <div class="flex gap-3 items-center">
                        <button onclick="addConsultingStudentRow()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl shadow-md transition-all flex items-center gap-2 hover:-translate-y-0.5">
                            <i class="ph-bold ph-plus-circle text-lg"></i> THÊM DÒNG
                        </button>
                    </div>
                </div>

                <!-- Spreadsheet Table -->
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col relative">
                    <div class="overflow-auto custom-scrollbar flex-1 p-0 m-0 relative">
                        <table class="w-full text-sm text-left border-collapse min-w-[800px]">
                            <thead class="text-[11px] font-black text-slate-500 uppercase tracking-widest bg-slate-50 sticky top-0 z-20 shadow-sm">
                                <tr>
                                    <th class="p-4 text-center border-r border-b border-slate-200 w-16">STT</th>
                                    <th class="p-4 border-r border-b border-slate-200 min-w-[200px]">Họ và tên</th>
                                    <th class="p-4 border-r border-b border-slate-200 w-32 text-center">Ngày sinh</th>
                                    <th class="p-4 border-r border-b border-slate-200 w-40 text-center">Số điện thoại</th>
                                    <th class="p-4 border-r border-b border-slate-200 min-w-[250px]">Tình trạng tư vấn</th>
                                    <th class="p-4 text-center border-b border-slate-200 w-24"><i class="ph-bold ph-gear"></i></th>
                                </tr>
                            </thead>
                            <tbody class="text-slate-700">
                                ${rowsHtml || '<tr><td colspan="6" class="p-16 text-center text-slate-400 font-medium text-base border-dashed border-2 border-slate-200 bg-slate-50/50">Bảng đang trống. Bấm "THÊM DÒNG" để bắt đầu.</td></tr>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    `;
}
</script>
</body>
</html>
